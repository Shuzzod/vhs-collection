<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя VHS коллекция</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Мои VHS кассеты</h1>

    <div class="io-buttons">
        <button onclick="exportCollection()">Скачать коллекцию (JSON)</button>
        <label class="import-label">
            Загрузить коллекцию
            <input type="file" id="importFile" accept=".json" onchange="importCollection(event)" hidden>
        </label>
    </div>

    <form id="addForm">
        <input type="text" id="title" placeholder="Название фильма" required>
        <select id="studio">
            <option value="">— Выберите студию —</option>
        </select>
        <button type="button" id="addStudioBtn">+ Новая студия</button>
        <select id="localization">
            <option value="">— Локализация —</option>
        </select>
        <button type="button" id="addLocalizationBtn">+ Своя</button>
        <input type="text" id="year" placeholder="Год" inputmode="numeric" maxlength="10">
        <select id="condition">
            <option value="Запечатана">Запечатана</option>
            <option value="Отличное">Отличное</option>
            <option value="Хорошее">Хорошее</option>
            <option value="Потёртости">Потёртости</option>
        </select>
        <input type="file" id="cover" accept="image/*">
        <button type="submit">Добавить кассету</button>
    </form>

    <div id="collection"></div>

    <script src="script.js"></script>
</body>
</html>
